name: GitBook Docs CI/CD & Link Integrity Guard

on:
  push:
    branches:
      - main
    paths:
      - 'src/core/featureRegistry.js'
      - 'scripts/sync_features_to_gitbook.js'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/core/featureRegistry.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-sync-docs:
    name: Validate Markdown Links & Sync to GitBook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Documentation Sync Engine
        run: node scripts/sync_features_to_gitbook.js

      - name: Verify Markdown Hyperlinks Integrity (Zero Broken Links Guard)
        run: node tests/test_step89_markdown_links_integrity.js

      - name: Verify GitBook URL Config & Normalization
        run: node tests/test_step88_gitbook_url_abstraction.js

      - name: Check and Commit Changes (Only on Push to Main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/)" ]; then
            git add docs/
            git commit -m "docs(ci): auto-sync features to GitBook and verify link integrity [skip ci]"
            git push origin main
            echo "✅ Successfully synced and pushed validated docs to GitBook!"
          else
            echo "✨ Docs are 100% synchronized and all 640+ links verified. No commit needed."
          fi
